<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <script src= "https://cdn.tailwindcss.com"></script>
</head> 
<body class="font-[Arial,sans-serif] bg-[#f0f0f0] flex items-center justify-center h-screen m-0 text-[#333]">
    <div class="bg-white p-5 rounded-lg shadow-[0_0_10px_rgba(0,0,0,0.5)] w-[300px]">
        <h1 class="font-bold text-4xl mb-5 text-[#333]">Register</h1>
            <form>
                <input type="text" id="userInput1" required class="w-full p-2.5 my-2.5 border border-[#ccc] rounded box-border text-[#333]" />
                <input type="text" id="userInput2" required class="w-full p-2.5 my-2.5 border border-[#ccc] rounded box-border text-[#333]" />
                <input type="text" id="userInput3" required class="w-full p-2.5 my-2.5 border border-[#ccc] rounded box-border text-[#333]" />
                <input type="text" id="userInput4" required class="w-full p-2.5 my-2.5 border border-[#ccc] rounded box-border text-[#333]" />

                <label for="dateOfBirth">Date of Birth</label>
                <input type="date" id="dateOfBirth" required class="w-full p-2.5 my-2.5 border border-[#ccc] rounded box-border text-[#333]" />
                <button type="submit" class="w-full p-3 bg-blue-500 text-white rounded hover:bg-blue-600">Register</button>

                <a href="login.html" class="block text-right mt-4 text-blue-500 hover:underline">Already have an account? Login</a>
            </form>
    </div>
</body>
</html>
